name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-build:
    name: Test & Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            bundles: appimage,deb
          - platform: windows-latest
            bundles: msi,nsis
          - platform: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate app icons
        working-directory: src-tauri
        run: npx tauri icon app-icon.png

      - name: Frontend build (tsc + vite)
        run: npm run build

      - name: Rust unit tests (三平台 CI 全跑)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Tauri build (打包 msi/dmg/AppImage)
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-bundle
          path: |
            src-tauri/target/release/bundle/**/*
          if-no-files-found: error
