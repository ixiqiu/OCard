name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-build:
    name: Test & Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            bundles: appimage,deb
          - platform: windows-latest
            bundles: msi,nsis
          - platform: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate app icons
        working-directory: src-tauri
        run: npx tauri icon app-icon.png

      - name: Frontend build (tsc + vite)
        run: npm run build

      - name: Rust unit tests (三平台 CI 全跑)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Tauri build (打包 msi/dmg/AppImage)
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Rebuild AppImage without bundled WebKitGTK (linux only)
        # AppImage 捆绑 Ubuntu 构建的 WebKitGTK 在 Arch 等滚动发行版上与系统 EGL
        # 不兼容（EGL_BAD_PARAMETER）。这里从 AppDir 移除 WebKit 后重新打包，
        # 运行时改用系统 libwebkit2gtk-4.1（用户需安装系统 webkit2gtk 依赖）。
        if: matrix.platform == 'ubuntu-latest'
        run: |
          set -e
          APP_DIR=src-tauri/target/release/bundle/appimage/OCard.AppDir
          # 移除捆绑的 WebKitGTK / JavaScriptCore（可能分布在 usr/lib 或 usr/lib/x86_64-linux-gnu）
          find "$APP_DIR/usr" \( -iname "*webkit*" -o -iname "*javascriptcore*" \) -prune -exec rm -rf {} + 2>/dev/null || true
          # 校验 AppDir 中不再包含 WebKitGTK（appimagetool 不会重新收集依赖）
          if find "$APP_DIR" \( -iname "*webkit*" -o -iname "*javascriptcore*" \) | grep -q .; then
            echo "ERROR: WebKitGTK still in AppDir"; exit 1;
          fi
          # appimagetool 只负责打包
          curl -sL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool.AppImage
          chmod +x /tmp/appimagetool.AppImage
          cd src-tauri/target/release/bundle/appimage
          APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool.AppImage OCard.AppDir OCard_0.1.0_amd64.AppImage

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-bundle
          path: |
            src-tauri/target/release/bundle/**/*
          if-no-files-found: error
